<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masar Splash Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@800&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#0d1a2e;display:grid;place-items:center;font-family:'Noto Kufi Arabic',system-ui,sans-serif}
.phone{width:min(390px,92vw);aspect-ratio:9/19.5;border-radius:44px;overflow:hidden;position:relative;
  background:radial-gradient(120% 90% at 30% 20%,#2E5A97,#1B3866 70%);box-shadow:0 20px 60px rgba(0,0,0,.5)}
svg{position:absolute;inset:0;margin:auto;width:78%;top:-12%}
.word{position:absolute;inset-inline:0;top:66%;text-align:center;color:#fff;font-size:44px;opacity:0;letter-spacing:.02em}
.word small{display:block;font-family:system-ui;font-size:12px;letter-spacing:.4em;color:#5FF5E4;opacity:.8;margin-top:-6px}
.play{position:absolute;inset:0;display:grid;place-items:center;color:#9FB6D6;font:600 15px system-ui;cursor:pointer;background:transparent;border:0}
.run .pageL{animation:openL .75s cubic-bezier(.2,.9,.25,1.15) .25s both}
.run .pageR{animation:openR .75s cubic-bezier(.2,.9,.25,1.15) .25s both}
.run .lines{animation:fade .35s ease .85s both}
.run .path{animation:draw .9s cubic-bezier(.55,.05,.35,1) 1.0s both}
.run .dot{animation:pop .5s cubic-bezier(.2,1.6,.4,1) 1.88s both}
.run .glow{animation:glow 1.1s ease-out 1.88s both}
.run .burst{animation:burst .9s ease-out 1.9s both}
.run .spark{animation:spark .8s ease-out both}
.run .word{animation:word .6s ease 2.3s both}
.pageL,.pageR{transform-box:view-box;transform-origin:512px 720px}
.dot,.glow,.burst{transform-box:view-box;transform-origin:625px 255px}
@keyframes openL{from{transform:scaleX(0) skewY(8deg)}to{transform:none}}
@keyframes openR{from{transform:scaleX(0) skewY(-8deg)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes glow{0%{transform:scale(.2);opacity:0}25%{opacity:1;transform:scale(1.6)}100%{transform:scale(1);opacity:1}}
@keyframes burst{0%{transform:scale(.3);opacity:0}2%{opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}
@keyframes word{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.run *{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body>
